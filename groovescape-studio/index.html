<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrooveScape Studio — Prototype</title>
<style>
:root{font-family:system-ui;background:#10131b;color:#f1f3fb}body{max-width:980px;margin:24px auto;padding:0 18px}header,section{background:#1b2030;border:1px solid #30374b;border-radius:16px;padding:18px;margin:12px 0}h1{margin:0}small{color:#a8b5d0}button,input{accent-color:#9bd8cf}button{border:1px solid #55647c;border-radius:9px;padding:10px;background:#283449;color:white;cursor:pointer}button[aria-pressed=true]{background:#5a9d90;color:#071b17}.track{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin:18px 0}.steps{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:5px}.steps button{padding:12px 0;min-width:0}.steps button.playing{outline:2px solid white}.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center}label{display:flex;gap:8px;align-items:center}input[type=range]{width:90px}@media(max-width:620px){.track{grid-template-columns:1fr}.steps{gap:3px}.steps button{padding:10px 0}}
</style>
<header><h1>GrooveScape Studio</h1><small>Early browser groovebox prototype • no hardware flashing</small></header>
<section class="tools"><button id="play">▶ Play</button><button id="stop">■ Stop</button><label>Tempo <input id="bpm" type="number" min="40" max="220" value="110" style="width:62px"> BPM</label><label>Master <input id="master" type="range" min="0" max="100" value="65"></label><button id="save">Export pattern</button><label><button id="loadButton">Import pattern</button><input id="load" type="file" accept=".json" hidden></label></section>
<section id="tracks"></section>
<section><h2>Hardware / Bluetooth</h2><p>SMC Mixer mapping and FM1 firmware integration are planned. The flasher remains disabled until a compatible firmware image is built and validated.</p><button disabled>Flash FM1 (not ready)</button></section>
<script>
const names=['Pad','Bass','Lead','Drums'];
const patterns=[[0,4,8,12],[0,3,7,10],[2,6,11,14],[0,4,8,12]];
const tracks=names.map((name,i)=>({name,steps:Array.from({length:16},(_,n)=>patterns[i].includes(n)),volume:.7,muted:false}));
const host=document.querySelector('#tracks');let ctx,step=0,playing=false,timeout=null,activeStep=-1;
function draw(){host.innerHTML='';tracks.forEach((t,i)=>{const row=document.createElement('div');row.className='track';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=t.name;info.append(title,document.createElement('br'));const mute=document.createElement('button');mute.textContent=t.muted?'Unmute':'Mute';mute.setAttribute('aria-pressed',String(t.muted));mute.onclick=()=>{t.muted=!t.muted;draw()};info.append(mute);const volume=document.createElement('input');volume.type='range';volume.min=0;volume.max=100;volume.value=t.volume*100;volume.setAttribute('aria-label',t.name+' volume');volume.oninput=()=>t.volume=Number(volume.value)/100;info.append(volume);const grid=document.createElement('div');grid.className='steps';t.steps.forEach((on,n)=>{const b=document.createElement('button');b.textContent=String(n+1);b.setAttribute('aria-label',t.name+' step '+(n+1));b.setAttribute('aria-pressed',String(on));if(n===activeStep)b.classList.add('playing');b.onclick=()=>{t.steps[n]=!t.steps[n];b.setAttribute('aria-pressed',String(t.steps[n]))};grid.append(b)});row.append(info,grid);host.append(row)})}
function note(freq,duration,gain,type='sine'){const now=ctx.currentTime;const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g).connect(ctx.destination);o.start(now);o.stop(now+duration+.02)}
function drum(gain){const now=ctx.currentTime;const n=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.12),ctx.sampleRate);const d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*.022));const src=ctx.createBufferSource(),g=ctx.createGain();src.buffer=n;g.gain.value=gain*.35;src.connect(g).connect(ctx.destination);src.start(now);note(75,.18,gain*.28)}
function tick(){if(!playing)return;activeStep=step;const m=Number(document.querySelector('#master').value)/100;const frequencies=[110,55,330];tracks.forEach((t,i)=>{if(t.muted||!t.steps[step])return;const gain=t.volume*m*.18;if(i===3)drum(gain);else note(frequencies[i]*(i===2?[1,1.125,1.25,1.5][step%4]:1),i===0?1.1:i===1?.24:.18,gain,i===1?'sawtooth':i===2?'triangle':'sine')});draw();step=(step+1)%16;timeout=setTimeout(tick,60000/Math.max(40,Math.min(220,Number(document.querySelector('#bpm').value)||110))/4)}
document.querySelector('#play').onclick=async()=>{if(playing)return;ctx??=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();playing=true;tick()};
document.querySelector('#stop').onclick=()=>{playing=false;clearTimeout(timeout);activeStep=-1;step=0;draw()};
document.querySelector('#save').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,bpm:document.querySelector('#bpm').value,tracks},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='groovescape-pattern.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#loadButton').onclick=()=>document.querySelector('#load').click();
document.querySelector('#load').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!Array.isArray(data.tracks)||data.tracks.length!==4||!data.tracks.every(t=>Array.isArray(t.steps)&&t.steps.length===16&&t.steps.every(v=>typeof v==='boolean')))throw Error('Invalid pattern');data.tracks.forEach((t,i)=>{tracks[i].steps=t.steps;tracks[i].volume=Math.max(0,Math.min(1,Number(t.volume)||0));tracks[i].muted=Boolean(t.muted)});document.querySelector('#bpm').value=Math.max(40,Math.min(220,Number(data.bpm)||110));draw()}catch(err){alert('Could not import: '+err.message)}};
draw();
</script></html>
