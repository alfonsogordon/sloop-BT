name: Publish SLOOP-BT Web Flasher
on:
  push:
    branches: [feature/smc-ble]
    paths:
      - flasher/**
      - mixer/**
      - tests/lab_flasher_test.mjs
      - web/fm1pkg.js
      - web/fm1ota.js
      - .github/workflows/publish-flasher.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-sloop-bt
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p site/mixer site/lab
          cp flasher/index.html site/index.html
          cp flasher/lab.html site/lab/index.html
          cp mixer/index.html site/mixer/index.html
          cp web/fm1pkg.js web/fm1ota.js site/
          test ! -e site/*.fwsc
          grep -q 'local firmware package' site/index.html
      - name: Basic JavaScript syntax checks
        run: |
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('site/mixer/index.html').read_text()
          match=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          assert match, 'mixer module script not found'
          pathlib.Path('/tmp/sloop_bt_mixer.mjs').write_text(match.group(1))
          PY
          node --check /tmp/sloop_bt_mixer.mjs
          python3 - <<'PY'
          import re, pathlib
          html=pathlib.Path('site/lab/index.html').read_text()
          match=re.search(r'<script type="module">(.*?)</script>', html, re.S)
          assert match, "lab flasher module script missing"
          pathlib.Path('/tmp/sloop_bt_lab.mjs').write_text(match.group(1))
          assert '96b192869ca45abdcb364ca1f6fbaf89819776553a0df2b330a5c238f6fe2ab1' in html
          assert "preflightOK" in html and "LAB_SIZE = 610076" in html
          assert "if(hash!==LAB_SHA)" in html
          assert "FLASH UNTESTED" in html
          assert "rfRisk" in html and "preflight" in html
          PY
          node --check /tmp/sloop_bt_lab.mjs
          cp site/fm1pkg.js /tmp/fm1pkg.mjs
          cp site/fm1ota.js /tmp/fm1ota.mjs
          node --check /tmp/fm1pkg.mjs
          node --check /tmp/fm1ota.mjs
      - name: Simulate all lab flasher safety gates without a MIDI device
        run: node tests/lab_flasher_test.mjs
      - name: Downloadable offline test bundle (independent of Pages)
        uses: actions/upload-artifact@v4
        with:
          name: sloop-bt-web-test-bundle
          path: site
          retention-days: 30
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Explain unavailable Pages hosting
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages was not enabled. The lab flasher is built but NOT hosted. Repo owner must enable Settings > Pages > Source: GitHub Actions."
          echo "## Pages not live" >> "$GITHUB_STEP_SUMMARY"
          echo "Enable GitHub Pages at https://github.com/alfonsogordon/sloop-BT/settings/pages and re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
